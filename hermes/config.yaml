_config_version: 51
_left_core_installed: [github-copilot]
model:
  provider: copilot
  default: gpt-6-luna
mcp_servers:
  github-copilot:
    url: https://api.githubcopilot.com/mcp/
    headers:
      Authorization: "Bearer ${GH_TOKEN}"
  quarkus-agent:
    command: jbang
    args: ["quarkus-agent-mcp@quarkusio"]
  huginn:
    command: jbang
    args: ["--quiet", "huginn-mcp@maveniverse"]
skills:
  external_dirs:
    - ~/.agents/skills
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
