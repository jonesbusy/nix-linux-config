_config_version: 53
_left_core_installed: [github-copilot]
model:
  provider: copilot
  default: mai-code-2-flash
mcp_servers:
  qmd:
    command: /home/valentin/.nix-profile/bin/qmd
    args: ["mcp"]
  swissgroceries:
    command: npx
    args: ["--yes", "@nicktcode/swissgroceries-mcp@0.12.0"]
    connect_timeout: 120
    timeout: 120
    sampling:
      enabled: false
approvals:
  destructive_slash_confirm: false
skills:
  external_dirs:
    - ~/.agents/skills
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
